<div class="reloj">
  <h2>Cronómetro</h2>

  <p class="tiempo" role="timer" aria-live="off">
    {{ tiempo(segundos()) }}
  </p>

  <div class="botones">
    <button type="button" (click)="alternar()" [disabled]="activo">Iniciar</button>
    <button type="button" (click)="alternar()" [disabled]="!activo">Pausa</button>
    <button type="button" (click)="registrar()">Vuelta</button>
  </div>

  <div class="vueltas" aria-label="Vueltas">
    @if (vueltas.length === 0) {
      <p class="vacio">Sin vueltas.</p>
    } @else {
      <ol>
        @for (vuelta of vueltas; track $index) {
          <li>{{ tiempo(vuelta) }}</li>
        }
      </ol>
    }
  </div>
</div>
