<h1> LISTA DE FRUTAS Y VERDURAS</h1>

<div class = "container">
<h2>Frutas</h2>


<ul>
    @for (fruta of frutas; track frutas){
    <li style="display: flex; flex-direction: row; justify-content: center; gap: 1rem;"> 
        <img class="fruta" [src]="fruta.imagen">
        {{ fruta.nombre}};
        @if(fruta.like){
            👌
          } 
         </li>
        }

        </ul>
