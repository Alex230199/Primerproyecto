<!-- Envuelve el título, el formulario y la lista dentro del borde exterior. -->
<div class="contenedor-principal">
<!-- Muestra el título del formulario. -->
<h1>Formulario de Halloween</h1>

<!-- Conecta este formulario HTML con el formulario reactivo de TypeScript. -->
<form [formGroup]="formulario" (ngSubmit)="agregarObjeto()">
	<!-- Indica que el siguiente campo contiene la URL de la imagen. -->
	<label for="imagen">Imagen (URL):</label>
	<!-- Conecta el campo de imagen con su control del formulario reactivo. -->
	<input id="imagen" type="text" formControlName="imagen" placeholder="https://ejemplo.com/imagen.jpg">
	<small>También puedes usar una ruta local, como /images/banana.jpg.</small>
	@if (formulario.controls.imagen.hasError('imagenInvalida') && formulario.controls.imagen.touched) {
		<small class="error-imagen">Introduce una URL HTTPS o una ruta que empiece por /images/.</small>
	}

	<!-- Indica que el siguiente campo es para el objeto de Halloween. -->
	<label for="objeto">Objeto:</label>
	<!-- Conecta este campo con el control llamado objeto. -->
	<input id="objeto" type="text" formControlName="objeto">

	<!-- Indica que el siguiente campo contiene la descripción del objeto. -->
	<label for="descripcion">Descripción:</label>
	<!-- Conecta el campo de descripción con su control del formulario reactivo. -->
	<textarea id="descripcion" formControlName="descripcion"></textarea>

	<!-- Indica que el siguiente campo contiene el nombre del propietario. -->
	<label for="propietario">Propietario:</label>
	<!-- Conecta el campo del propietario con su control del formulario reactivo. -->
	<input id="propietario" type="text" formControlName="propietario">

	<!-- Envía el formulario y lo deshabilita mientras sus campos no sean válidos. -->
	<button class="boton-enviar" type="submit" [disabled]="formulario.invalid">Enviar</button>
	
</form>

<!-- Muestra el título de la lista acumulada. -->
<h2>Lista de objetos de Halloween:</h2>
<!-- Recorre el array y crea una tarjeta hija para cada objeto de Halloween. -->
<app-tarjeta-halloween *ngFor="let objeto of objetosHalloween" [objeto]="objeto"></app-tarjeta-halloween>
</div>
