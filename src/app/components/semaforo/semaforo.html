<div style="display: flex; flex-direction: row; justify-content: center; gap: 1rem;">
    @for (semaforo of [1, 2, 3, 4, 5]; track semaforo) {
       <div class="semaforo">
          <div class="luz rojo"
              [style.background-color]="obtenerColorLuz('rojo')"></div>
          <div class="luz amarillo"
              [style.background-color]="obtenerColorLuz('amarillo')"></div>
          <div class="luz verde"
              [style.background-color]="obtenerColorLuz('verde')"></div>
       </div>
    }
</div>
<div style="display: flex; flex-direction: row; justify-content: center; gap: 1rem; margin-top: 1rem;">
 
    <h1 class="contador" style="color: green">
        Contador: {{ contador() }}
    </h1>
 
    <button matButton="outlined" (click)="incrementar()" >+1</button>
    <button matButton="outlined" (click)="decrementar()" >-1</button>
    <button  matButton="filled" (click)="reset()" >Reiniciar</button>
 

</div>
