<div class="calculadora">
  <output class="resultado" aria-live="polite">{{ resultado }}</output>

  <div class="operandos">
    <input type="number" step="any" placeholder="Primer número" [value]="primerNumero"
      (focus)="seleccionarCampo('primerNumero')"
      (input)="actualizarNumero('primerNumero', $event)"
      aria-label="Primer número">
    <input type="number" step="any" placeholder="Segundo número" [value]="segundoNumero"
      (focus)="seleccionarCampo('segundoNumero')"
      (input)="actualizarNumero('segundoNumero', $event)"
      aria-label="Segundo número">
  </div>

  <div class="teclado">
    <button class="botones" type="button" (click)="agregarnumero('7')">7</button>
    <button class="botones" type="button" (click)="agregarnumero('8')">8</button>
    <button class="botones" type="button" (click)="agregarnumero('9')">9</button>
    <button class="botones" type="button" (click)="seleccionarOperacion('/')">÷</button>

    <button class="botones" type="button" (click)="agregarnumero('4')">4</button>
    <button class="botones" type="button" (click)="agregarnumero('5')">5</button>
    <button class="botones" type="button" (click)="agregarnumero('6')">6</button>
    <button class="botones" type="button" (click)="seleccionarOperacion('*')">×</button>

    <button class="botones" type="button" (click)="agregarnumero('1')">1</button>
    <button class="botones" type="button" (click)="agregarnumero('2')">2</button>
    <button class="botones" type="button" (click)="agregarnumero('3')">3</button>
    <button class="botones" type="button" (click)="seleccionarOperacion('-')">−</button>

    <button class="botones" type="button" (click)="borrar()">C</button>
    <button class="botones" type="button" (click)="agregarnumero('0')">0</button>
    <button class="botones" type="button" (click)="agregarnumero('.')">.</button>
    <button class="botones" type="button" (click)="seleccionarOperacion('+')">+</button>

    <button class="botones" type="button" (click)="calcular()">=</button>
  </div>

  </div>
