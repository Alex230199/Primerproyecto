<article class="tarjeta" [class.expandida]="detallesAbiertos" aria-label="Carta de Hermingo"> 
	<header class="encabezado"> 
		<span class="numero">#{{ numero }}</span> 
		<div class="identidad"> 
			<h2>{{ nombre }}</h2> 
			<span class="clase">{{ clase }}</span> 
		</div> 
	</header> 

	<img class="animal" [src]="imagen" [alt]="nombre" /> 

	<div class="atributos" aria-label="Atributos"> 
		<div class="atributo" [attr.aria-label]="'Ataque: ' + ataque"> 
			<span aria-hidden="true">🗡️</span> 
			<strong>{{ ataque }}</strong> 
		</div> 
		<div class="atributo" [attr.aria-label]="'Defensa: ' + defensa"> 
			<span aria-hidden="true">🛡️</span> 
			<strong>{{ defensa }}</strong> 
		</div> 
	</div> 

	<button class="equipar" type="button">EQUIPAR</button> 
	<p id="descripcion-hermingo" class="descripcion" [hidden]="!detallesAbiertos">Perdido en sus ojos: Hermingo bloquea la capacidad del catalejo para espiar al jugador usuario.</p> 

	<button class="desplegable" type="button" [attr.aria-expanded]="detallesAbiertos" [attr.aria-label]="detallesAbiertos ? 'Ocultar detalles de Hermingo' : 'Mostrar detalles de Hermingo'" aria-controls="descripcion-hermingo" (click)="alternarDetalles()">⌄</button> 
</article>
